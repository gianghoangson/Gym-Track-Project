<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout - Gym Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/workout.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h1>Buổi tập</h1>

    <!-- Chưa bắt đầu -->
    <div id="startBox" class="card">
      <button onclick="startWorkout()">Bắt đầu buổi tập trống</button>
      <br><br>
      <label>Hoặc chọn routine:</label><br>
      <select id="routineSelect"></select>
      <button class="light" onclick="startFromRoutine()">Bắt đầu</button>
    </div>

    <div class="card" id="routineManager">
      <h3>Routine</h3>
      <div id="routineList"></div>
      <button class="light" onclick="newRoutine()">Tạo routine</button>
      <form id="routineForm" hidden onsubmit="saveRoutine(event)">
        <br>
        <label for="routineName">Tên routine</label>
        <input id="routineName" required placeholder="Ví dụ: Push Day">
        <table>
          <thead><tr><th>Bài tập</th><th>Số set</th><th>Thứ tự</th></tr></thead>
          <tbody id="routineRows"></tbody>
        </table>
        <button type="button" class="light" onclick="addRoutineRow()">Thêm bài tập</button>
        <button type="submit" id="saveRoutineBtn">Lưu routine</button>
        <button type="button" class="light" onclick="closeRoutineForm()">Huỷ</button>
      </form>
    </div>

    <!-- Đang tập -->
    <div id="workoutBox" style="display: none;">
      <div id="timer" style="display: none;"></div>

      <div class="card add-set" id="setControls">
        <h3>Thêm set</h3>
        <select id="exerciseSelect"></select>
        <input type="number" id="weight" placeholder="kg" min="0" step="any">
        <input type="number" id="reps" placeholder="reps" min="0" step="1">
        <button onclick="addSet()">Thêm</button>
        <br><br>
        <label>Nghỉ giữa set (giây):</label>
        <input type="number" id="restSeconds" value="60" min="0" step="1">
      </div>

      <table>
        <tr><th>Bài tập</th><th>Set</th><th>kg</th><th>Reps</th><th>1RM ước tính</th><th></th></tr>
        <tbody id="sets"></tbody>
      </table>

      <div id="workoutActions">
        <button onclick="finishWorkout()">Kết thúc buổi tập</button>
        <button class="light" onclick="cancelWorkout()">Huỷ buổi tập</button>
      </div>
      <p id="finishedNotice" hidden>Buổi tập đã kết thúc. <a href="history.html">Xem lịch sử</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/live_workout.js"></script>
</body>
</html>
