<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercises - Gym Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h1>Bài tập</h1>

    <div class="card">
      <h3 id="exerciseFormTitle">Thêm bài tập mới</h3>
      <form id="exerciseForm" onsubmit="saveExercise(event)">
        <input type="text" id="name" placeholder="Tên bài tập" required>
        <input type="text" id="muscle" placeholder="Nhóm cơ (vd: Chest)">
        <input type="text" id="equipment" placeholder="Dụng cụ (vd: Barbell)">
        <br><br>
        <button type="submit" id="saveExerciseBtn">Thêm</button>
        <button type="button" class="light" id="cancelEdit" hidden onclick="resetExerciseForm()">Huỷ sửa</button>
      </form>
    </div>

    <table>
      <tr><th>Tên</th><th>Nhóm cơ</th><th>Dụng cụ</th><th></th></tr>
      <tbody id="list"></tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/exercises.js"></script>

</body>
</html>
