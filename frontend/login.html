<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Gym Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container" style="max-width: 400px;">
    <h1>Gym Tracker</h1>
    <div class="card">
      <h3 id="title">Đăng nhập</h3>
      <div id="error"></div>
      <form onsubmit="submitForm(event)">
        <label>Email</label>
        <input type="email" id="email" required>
        <br><br>
        <label>Mật khẩu</label>
        <input type="password" id="password" required>
        <br><br>
        <button type="submit" id="submitBtn">Đăng nhập</button>
        <button type="button" class="light" onclick="switchMode()" id="switchBtn">Tạo tài khoản</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Nếu đã đăng nhập thì vào thẳng dashboard
    if (getToken()) {
      window.location.href = "index.html";
    }

    let isRegister = false;

    // Chuyển giữa đăng nhập và đăng ký
    function switchMode() {
      isRegister = !isRegister;
      document.getElementById("title").textContent = isRegister ? "Đăng ký" : "Đăng nhập";
      document.getElementById("submitBtn").textContent = isRegister ? "Đăng ký" : "Đăng nhập";
      document.getElementById("switchBtn").textContent = isRegister ? "Đã có tài khoản" : "Tạo tài khoản";
    }

    async function submitForm(event) {
      event.preventDefault();
      const body = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      };
      try {
        if (isRegister) {
          await callApi("/users/register", "POST", body);
        }
        const data = await callApi("/users/login", "POST", body);
        saveToken(data.access_token);
        window.location.href = "index.html";
      } catch (error) {
        document.getElementById("error").innerHTML = '<div class="error">' + error.message + "</div>";
      }
    }
  </script>
</body>
</html>
